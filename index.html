<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gotham Needs You</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cellipse cx='32' cy='32' rx='30' ry='20' fill='%23f2d24b' stroke='%230b0b12' stroke-width='3'/%3E%3Cpath d='M6 30 L18 24 L22 28 L28 22 L30 16 L32 20 L34 16 L36 22 L42 28 L46 24 L58 30 L50 36 L46 34 L40 38 L32 48 L24 38 L18 34 L14 36 Z' fill='%230b0b12'/%3E%3C/svg%3E" />
  <meta name="description" content="A comic-book Batman adventure made as a birthday gift." />
  <!-- Start the model downloads while the game script is still loading. -->
  <link rel="preload" href="./assets/outfits.glb" as="fetch" crossorigin />
  <link rel="preload" href="./assets/anims2.glb" as="fetch" crossorigin />
  <link rel="preload" href="./assets/anims1.glb" as="fetch" crossorigin />
  <link rel="preload" href="./assets/hero_m.glb" as="fetch" crossorigin />
  <link rel="preload" href="./assets/hero_f.glb" as="fetch" crossorigin />
  <link rel="preload" href="./assets/hair_long.glb" as="fetch" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Barlow+Condensed:ital,wght@0,600;1,700;1,800&family=Patrick+Hand+SC&display=swap" rel="stylesheet" />
</head>
<body>
  <canvas id="game"></canvas>
  <div id="loading" class="loading">
    <div class="cover">
      <div class="kicker">A birthday special</div>
      <h1>Gotham needs you, <span id="loading-name">Mansi</span></h1>
      <div class="bar"><i></i></div>
      <p class="mobile-note">This one needs a computer with a keyboard and mouse. Open the link on a laptop.</p>
      <p class="error-note">Gotham could not start in this browser. It needs WebGL2: try the latest Chrome, Edge or Firefox with hardware acceleration turned on.</p>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
